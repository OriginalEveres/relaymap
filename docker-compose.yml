services:
  postgres:
    image: postgres:16-alpine
    container_name: relaymap-postgres
    environment:
      POSTGRES_USER: relaymap
      POSTGRES_PASSWORD: relaymap
      POSTGRES_DB: relaymap
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relaymap -d relaymap"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: relaymap-adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
