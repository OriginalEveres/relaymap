x-source-mounts: &source-mounts
  - ./apps/api/src:/repo/apps/api/src
  - ./apps/crawler/src:/repo/apps/crawler/src
  - ./apps/web/src:/repo/apps/web/src
  - ./packages/api-contracts/src:/repo/packages/api-contracts/src
  - ./packages/bitcoin-network/src:/repo/packages/bitcoin-network/src
  - ./packages/crawling/src:/repo/packages/crawling/src
  - ./packages/db/src:/repo/packages/db/src
  - ./packages/db/prisma:/repo/packages/db/prisma
  - ./packages/ui/src:/repo/packages/ui/src
  - ./packages/common/type-utils/src:/repo/packages/common/type-utils/src

services:
  postgres:
    image: postgres:16-alpine
    container_name: relaymap-postgres
    environment:
      POSTGRES_USER: relaymap
      POSTGRES_PASSWORD: relaymap
      POSTGRES_DB: relaymap
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relaymap -d relaymap"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: relaymap-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://relaymap:relaymap@postgres:5432/relaymap?schema=public
    command: pnpm --filter @relaymap/db prisma:migrate:deploy
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: relaymap-api-dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://relaymap:relaymap@postgres:5432/relaymap?schema=public
      API_PORT: 3000
      API_CORS_ORIGINS: "http://localhost:3001"
    volumes: *source-mounts
    command: pnpm --filter @relaymap/api dev
    depends_on:
      migrate:
        condition: service_completed_successfully

  crawler:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: relaymap-crawler-dev
    environment:
      DATABASE_URL: postgresql://relaymap:relaymap@postgres:5432/relaymap?schema=public
      CRAWL_CRON: "0 */6 * * *"
      CRAWL_MAX_CONCURRENT: 500
      CRAWL_MAX_DEPTH: 2
      CRAWL_MAX_NODES: 100000
      CRAWL_CONNECT_TIMEOUT_MS: 5000
      CRAWL_HANDSHAKE_TIMEOUT_MS: 5000
    volumes: *source-mounts
    command: ["sh", "-c", "pnpm --filter @relaymap/crawler build && exec node --enable-source-maps apps/crawler/dist/main.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: relaymap-web-dev
    ports:
      - "3001:3001"
    environment:
      API_PROXY_TARGET: http://api:3000
    volumes: *source-mounts
    command: pnpm --filter @relaymap/web dev
    depends_on:
      - api

  adminer:
    image: adminer:latest
    container_name: relaymap-adminer
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
