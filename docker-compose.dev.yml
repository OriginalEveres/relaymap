services:
  postgres:
    image: postgres:16-alpine
    container_name: relaymap-postgres
    environment:
      POSTGRES_USER: relaymap
      POSTGRES_PASSWORD: relaymap
      POSTGRES_DB: relaymap
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relaymap -d relaymap"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    container_name: relaymap-migrate
    environment:
      DATABASE_URL: postgresql://relaymap:relaymap@postgres:5432/relaymap?schema=public
    command: pnpm --filter @relaymap/db prisma:migrate:deploy
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: relaymap-api-dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://relaymap:relaymap@postgres:5432/relaymap?schema=public
      API_PORT: 3000
      API_CORS_ORIGINS: "http://localhost:3001"
    volumes:
      - .:/repo
      - node_modules:/repo/node_modules
    command: pnpm --filter @relaymap/api dev
    depends_on:
      migrate:
        condition: service_completed_successfully

  crawler:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: relaymap-crawler-dev
    environment:
      DATABASE_URL: postgresql://relaymap:relaymap@postgres:5432/relaymap?schema=public
      CRAWL_CRON: "0 */6 * * *"
      CRAWL_MAX_CONCURRENT: 500
      CRAWL_MAX_DEPTH: 2
      CRAWL_CONNECT_TIMEOUT_MS: 5000
      CRAWL_HANDSHAKE_TIMEOUT_MS: 5000
    volumes:
      - .:/repo
      - node_modules:/repo/node_modules
    command: pnpm --filter @relaymap/crawler dev
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: relaymap-web-dev
    ports:
      - "3001:3001"
    environment:
      VITE_API_URL: http://api:3000
    volumes:
      - .:/repo
      - node_modules:/repo/node_modules
    command: pnpm --filter @relaymap/web dev -- --host 0.0.0.0
    depends_on:
      - api

  adminer:
    image: adminer:latest
    container_name: relaymap-adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  node_modules:
